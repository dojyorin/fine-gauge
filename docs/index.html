<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
<meta name="referrer" content="no-referrer">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='50%' style='dominant-baseline: central; text-anchor: middle; font-size: 100px;'>🚥</text></svg>">

<script async type="module">
    import {createApp, defineComponent, ref, provide, inject, computed} from "https://esm.sh/vue@3.5.42/dist/vue.esm-bundler.js?target=esnext";
    import {createRouter, createWebHashHistory} from "https://esm.sh/vue-router@5.3.1/dist/vue-router.js?target=esnext";
    import {createVuetify, useTheme} from "https://esm.sh/vuetify@4.1.7/dist/vuetify.esm.js?target=esnext";

    if (!globalThis.Temporal) {
        await import("https://esm.sh/temporal-polyfill@1.0.1/global?target=esnext");
    }

    /**
     * @typedef {{mount(target: string | Element): Record<string, unknown>; use(plugin: Plugin): Vue;}} Vue
     */

    /**
     * @typedef {{install(context: Vue): void;}} Plugin
     */

    /**
     * @typedef {{template: string; setup?(): Record<string, unknown> | void; components?: Record<string, Component>;}} Component
     */

    /**
     * @template T
     * @typedef {{value: T;}} Ref
     */

    /**
     * @typedef {Plugin & {push(path: string): void; beforeEach(func: (to: Route, from: Route, next: () => void) => Promise<void | boolean | string>): void;}} Router
     */

    /**
     * @typedef {{path: string; hash: string; query: Record<string, string>; params: Record<string, string>; name?: string; meta?: Record<string, unknown>;}} Route
     */

    /**
     * @typedef {Plugin & {theme: Theme;}} Vuetify
     */

    /**
     * @typedef {{global: {name: Ref<string>;};}} Theme
     */

    /** @type {(component: Component) => Vue} */
    const _createApp = createApp;
    /** @type {(component: Component) => Component} */
    const _defineComponent = defineComponent;
    /** @type {<T>(value: T) => Ref<T>} */
    const _ref = ref;
    /** @type {<T>(key: string, value: T) => void} */
    const _provide = provide;
    /** @type {<T>(key: string) => T | undefined} */
    const _inject = inject;
    /** @type {<T>(func: () => T) => Ref<T>} */
    const _computed = computed;
    /** @type {(option: {history: Record<string, unknown>; routes: {path: string; name?: string; component?: Component;}[];}) => Router} */
    const _createRouter = createRouter;
    /** @type {() => Record<string, unknown>} */
    const _createWebHashHistory = createWebHashHistory;
    /** @type {(option?: {theme?: {defaultTheme?: string;}; defaults?: Record<string, Record<string, unknown>>; components?: Record<string, unknown>; aliases?: Record<string, unknown>; directives?: Record<string, unknown>;}) => Vuetify} */
    const _createVuetify = createVuetify;
    /** @type {() => Theme} */
    const _useTheme = useTheme;

    import {Chart} from "https://esm.sh/chart.js@4.5.1/auto?target=esnext";

    /**
     * @typedef {{type: string; data: {datasets: {data: unknown[]; label?: string; backgroundColor?: string;}[]; labels?: string[];}; options?: {plugins?: {title?: {display?: boolean; text?: string;}; tooltip?: {callbacks?: {afterLabel?(): string | string[] | void;};};};} & BarOption;}} Option
     */

    /**
     * @typedef {{scales?: {y?: {ticks?: {stepSize?: number; precision?: number;};};};}} BarOption
     */

    /** @type {new (target: HTMLCanvasElement | OffscreenCanvas, option: Option) => {clear(): void; update(): void;} & Omit<Option, "type">} */
    const _Chart = Chart;

    import {default as confetti} from "https://esm.sh/canvas-confetti@1.9.4?target=esnext";

    /** @type {(option?: {angle?: number; origin?: {x?: number; y?: number;};}) => Promise<void>} */
    const _confetti = confetti;

    import {z} from "https://esm.sh/zod@4.5.4?target=esnext";

    /** @type {unknown} */
    const _z = z;

    /**
     * @template {Record<string, unknown> | unknown[]} T
     * @param {Storage} storage
     * @param {string} key
     * @param {T} initialValue
     * @return {T}
     */
    function createStorage(storage, key, initialValue) {
        const json = storage.getItem(key);

        if (json === null) {
            storage.setItem(key, JSON.stringify(initialValue));
        }

        /** @type {T} */
        const value = JSON.parse(json ?? JSON.stringify(initialValue));

        return (/** @type {<U extends unknown>(rawValue: U) => U} */function recurse(rawValue) {
            if (typeof rawValue !== "object" || rawValue === null) {
                return rawValue;
            }

            for (const property of Reflect.ownKeys(rawValue)) {
                const descriptor = Reflect.getOwnPropertyDescriptor(rawValue, property);

                if (descriptor?.writable) {
                    Reflect.set(rawValue, property, recurse(descriptor.value));
                }
            }

            return new Proxy(rawValue, {
                set(target, property, newValue) {
                    const success = Reflect.set(target, property, recurse(newValue));

                    if (success) {
                        storage.setItem(key, JSON.stringify(value));
                    }

                    return success;
                },
                deleteProperty(target, property) {
                    const success = Reflect.deleteProperty(target, property);

                    if (success) {
                        storage.setItem(key, JSON.stringify(value));
                    }

                    return success;
                }
            });
        })(value);
    }

    /**
     * @param {string} name
     * @param {BlobPart} body
     * @return {void}
     */
    function download(name, body) {
        const a = document.createElement("a");

        a.download = name;
        a.href = URL.createObjectURL(new Blob([body]));

        a.click();
    }

    /** @type {{date: string; gauge: string[]; memo: string;}[]} */
    const diary = createStorage(sessionStorage, "diary", []);
    /** @type {string[]} */
    const gauge = createStorage(sessionStorage, "gauge", []);

    function useDiary() {
        const diaryRef = _ref(diary);
        const gaugeRef = _ref(gauge);

        const today = Temporal.Now.plainDateISO().toString();

        const diaryPageToday = _computed(() => diaryRef.value.find(({date}) => date === today));

        /**
         * @param {string[]} gauge
         * @param {string} memo
         * @return {void}
         */
        function writeDiary(gauge, memo) {
            if (diaryPageToday.value) {
                diaryPageToday.value.gauge = gauge;
                diaryPageToday.value.memo = memo;
            } else {
                diaryRef.value.push({
                    date: today,
                    gauge: [],
                    memo: ""
                });
            }
        }

        return {diaryRef, gaugeRef, diaryPageToday, writeDiary};
    }

    function useDialog() {
        /** @type {ReturnType<typeof _inject<Ref<{color: string; text: string;}[]>>>} */
        const toasts = _inject("toasts");
        /** @type {ReturnType<typeof _inject<Ref<boolean>>>} */
        const loading = _inject("loading");

        if (!toasts || !loading) {
            throw new Error();
        }

        /**
         * @param {string} color
         * @param {string} text
         * @return {void}
         */
        function pushToast(color, text) {
            if (!toasts) {
                throw new Error();
            }

            toasts.value.push({color, text});
        }

        /**
         * @param {boolean} [state]
         * @return {void}
         */
        function toggleLoading(state) {
            if (!loading) {
                throw new Error();
            }

            loading.value = state ?? !loading.value;
        }

        return {toasts, loading, pushToast, toggleLoading};
    }

    const component = _defineComponent({
        template: /*html*/`
            <v-app>
                <x-toast></x-toast>
                <x-loading></x-loading>
                <x-header></x-header>
                <v-main>
                    <router-view></router-view>
                </v-main>
            </v-app>
        `,
        components: {
            "x-toast": _defineComponent({
                template: /*html*/`
                    <v-snackbar-queue closable location="top right" timeout="5000" v-model="toasts">
                        <template #actions="{props}">
                            <v-btn :="props" density="compact" icon="mdi-close"></v-btn>
                        </template>
                    </v-snackbar-queue>
                `,
                setup() {
                    const {toasts} = useDialog();

                    return {toasts};
                }
            }),
            "x-loading": _defineComponent({
                template: /*html*/`
                    <v-overlay persistent no-click-animation class="justify-center align-center" v-model="loading">
                        <v-progress-circular indeterminate size="60" width="4" color="primary"></v-progress-circular>
                    </v-overlay>
                `,
                setup() {
                    const {loading} = useDialog();

                    return {loading};
                }
            }),
            "x-header": _defineComponent({
                template: /*html*/`
                    <v-app-bar theme="dark" density="compact">
                        <template #prepend>
                            <v-app-bar-nav-icon @click="nav = !nav;"></v-app-bar-nav-icon>
                        </template>

                        <template #append>
                            <v-btn icon="mdi-theme-light-dark" @click="toggleDark();"></v-btn>
                        </template>

                        <template #image>
                            <v-img gradient="45deg, #10B5B2, #22E6B5"></v-img>
                        </template>

                        <v-app-bar-title>
                            <router-link class="text-decoration-none text-high-emphasis" to="/">元気ゲージ</router-link>
                        </v-app-bar-title>
                    </v-app-bar>

                    <v-navigation-drawer floating temporary v-model="nav">
                        <v-list nav density="compact">
                            <v-list-item to="/">
                                <v-list-item-title>ホーム</v-list-item-title>
                            </v-list-item>

                            <v-list-item to="/diary">
                                <v-list-item-title>日記</v-list-item-title>
                            </v-list-item>

                            <v-list-item to="/statistics">
                                <v-list-item-title>統計</v-list-item-title>
                            </v-list-item>

                            <v-list-item to="/configure">
                                <v-list-item-title>設定</v-list-item-title>
                            </v-list-item>

                            <v-list-item to="/about">
                                <v-list-item-title>このアプリについて</v-list-item-title>
                            </v-list-item>
                        </v-list>
                    </v-navigation-drawer>
                `,
                setup() {
                    const theme = _useTheme();

                    const nav = _ref(false);

                    function toggleDark() {
                        theme.global.name.value = theme.global.name.value === "dark" ? "light" : "dark";
                    }

                    return {nav, toggleDark};
                }
            })
        },
        setup() {
            _provide("toasts", _ref([]));
            _provide("loading", _ref(false));
        }
    });

    const router = _createRouter({
        history: _createWebHashHistory(),
        routes: [{
            path: "/",
            component: _defineComponent({
                template: /*html*/`
                    <v-container>
                        <v-row>
                            <v-col cols sm="4" md="3">
                                <v-card height="100" color="cyan-darken-1" to="/diary">
                                    <v-card-item>
                                        <v-card-title>日記</v-card-title>
                                        <v-card-subtitle>今日の出来事を記録する</v-card-subtitle>
                                    </v-card-item>
                                </v-card>
                            </v-col>

                            <v-col cols sm="4" md="3">
                                <v-card height="100" color="green-darken-1" to="/statistics">
                                    <v-card-item>
                                        <v-card-title>統計</v-card-title>
                                        <v-card-subtitle>過去の記録を分析する</v-card-subtitle>
                                    </v-card-item>
                                </v-card>
                            </v-col>

                            <v-col cols sm="4" md="3">
                                <v-card height="100" color="purple-lighten-1" to="/configure">
                                    <v-card-item>
                                        <v-card-title>設定</v-card-title>
                                        <v-card-subtitle>システムの挙動を調整する</v-card-subtitle>
                                    </v-card-item>
                                </v-card>
                            </v-col>

                            <v-col cols sm="4" md="3">
                                <v-card height="100" color="pink-lighten-1" to="/about">
                                    <v-card-item>
                                        <v-card-title>このアプリについて</v-card-title>
                                        <v-card-subtitle>概要やヘルプなど</v-card-subtitle>
                                    </v-card-item>
                                </v-card>
                            </v-col>
                        </v-row>
                    </v-container>
                `
            })
        }, {
            path: "/diary",
            component: _defineComponent({
                template: /*html*/`
                    <v-container max-width="600">
                        <v-card flat color="transparent">
                            <v-card-item>
                                <v-card-title class="text-headline-large">{{todayReport.date.replaceAll("-", "/")}} の日記</v-card-title>
                                <v-card-subtitle>できたことを記録しよう！</v-card-subtitle>
                            </v-card-item>
                        </v-card>

                        <v-row>
                            <v-col cols="12">
                                <v-card>
                                    <v-card-text>
                                        <v-list v-if="actions.length" selectable select-strategy="independent" v-model:selected="todayReport.actions">
                                            <template v-for="(action, i) in actions">
                                                <v-divider v-if="i"></v-divider>

                                                <v-list-item :value="action">
                                                    <v-list-item-title v-if="!actions_edit[i]">{{action}}</v-list-item-title>
                                                    <v-text-field v-else hide-details single-line v-model="action" @keyup.enter="actions_edit[i] = false;"></v-text-field>

                                                    <template #prepend="{isSelected, select}">
                                                        <v-checkbox v-if="!actions_edit[i]" hide-details :model-value="isSelected" @update:model-value="select"></v-checkbox>
                                                    </template>

                                                    <template #append="{isSelected}">
                                                        <template v-if="actions_edit[i]">
                                                            <div class="d-flex flex-column">
                                                                <v-btn flat density="comfortable" icon="mdi-menu-up-outline" :style="{'visibility': i === 0 ? 'hidden' : 'revert'}" @click="actions.splice(i - 1, 2, actions[i], actions[i - 1]);"></v-btn>
                                                                <v-btn flat density="comfortable" icon="mdi-menu-down-outline" :style="{'visibility': i + 1 === actions.length ? 'hidden' : 'revert'}" @click="actions.splice(i, 2, actions[i + 1], actions[i]);"></v-btn>
                                                            </div>

                                                            <v-btn flat density="comfortable" icon="mdi-playlist-remove" @click="isSelected = false; actions.splice(i, 1);"></v-btn>
                                                            <v-btn flat density="comfortable" icon="mdi-playlist-check" :disabled="!action" @click="actions_edit[i] = false;"></v-btn>
                                                        </template>

                                                        <v-btn v-else flat density="comfortable" icon="mdi-playlist-edit" @click="isSelected = false; actions_edit[i] = true;"></v-btn>
                                                    </template>
                                                </v-list-item>
                                            </template>
                                        </v-list>

                                        <v-list v-else>
                                            <v-list-item>
                                                <v-list-item-title>(活動がありません)</v-list-item-title>
                                            </v-list-item>
                                        </v-list>

                                        <v-text-field hide-details label="活動" v-model="newAction">
                                            <template #append>
                                                <v-btn flat density="comfortable" icon="mdi-playlist-plus" :disabled="!newAction || actions.includes(newAction)" @click="actions.push(newAction); newAction = '';"></v-btn>
                                            </template>
                                        </v-text-field>
                                    </v-card-text>
                                </v-card>
                            </v-col>

                            <v-col cols="12">
                                <v-card>
                                    <v-card-text>
                                        <v-textarea no-resize hide-details label="メモ帳" v-model="todayReport.memo"></v-textarea>
                                    </v-card-text>
                                </v-card>
                            </v-col>
                        </v-row>
                    </v-container>
                `,
                setup() {
                    const {pushToast} = vueUseDialog();
                    const {actions, todayReport} = vueUseReport();

                    const actions_edit = _ref(Array.from({length: actions.value.length}, () => false));
                    const newAction = _ref("");

                    return {actions, todayReport, actions_edit, newAction};
                }
            })
        }, {
            path: "/statistics",
            component: _defineComponent({
                template: /*html*/`
                    <v-container>
                        <v-card flat color="transparent">
                            <v-card-item>
                                <v-card-title class="text-headline-large">統計</v-card-title>
                            </v-card-item>
                        </v-card>
                    </v-container>
                `
            })
        }, {
            path: "/configure",
            component: _defineComponent({
                template: /*html*/`
                    <v-container>
                        <v-card flat color="transparent">
                            <v-card-item>
                                <v-card-title class="text-headline-large">設定</v-card-title>
                            </v-card-item>
                        </v-card>

                        <v-row>
                            <v-col cols="12">
                                <v-card>
                                    <v-card-item>
                                        <v-card-title>バックアップとリストア</v-card-title>
                                    </v-card-item>

                                    <v-card-actions>
                                        <v-dialog>
                                            <template #activator="{props}">
                                                <v-btn :="props">バックアップ</v-btn>
                                            </template>

                                            <template #="{isActive}">
                                                <v-card>
                                                    <v-card-item>
                                                        <v-card-title>バックアップ</v-card-title>
                                                    </v-card-item>

                                                    <v-card-text>
                                                        データベースからファイルにエクスポートします。
                                                    </v-card-text>

                                                    <v-card-actions>
                                                        <v-btn variant="outlined" color="blue" @click="exportReport(); isActive.value = false;">実行</v-btn>
                                                        <v-btn @click="isActive.value = false;">キャンセル</v-btn>
                                                    </v-card-actions>
                                                </v-card>
                                            </template>
                                        </v-dialog>

                                        <v-dialog>
                                            <template #activator="{props}">
                                                <v-btn :="props">リストア</v-btn>
                                            </template>

                                            <template #="{isActive}">
                                                <v-card>
                                                    <v-card-item>
                                                        <v-card-title>リストア</v-card-title>
                                                    </v-card-item>

                                                    <v-card-text>
                                                        ファイルからデータベースにインポートします。

                                                        <div class="text-red">[注意] 既存のデータは全て削除されます。</div>
                                                    </v-card-text>

                                                    <v-card-actions>
                                                        <v-btn variant="outlined" color="red" @click="importReport(); isActive.value = false;">実行</v-btn>
                                                        <v-btn @click="isActive.value = false;">キャンセル</v-btn>
                                                    </v-card-actions>
                                                </v-card>
                                            </template>
                                        </v-dialog>
                                    </v-card-actions>
                                </v-card>
                            </v-col>
                        </v-row>
                    </v-container>
                `,
                setup() {
                    const {pushToast, toggleLoading} = vueUseDialog();
                    const {reports} = vueUseReport();

                    async function importReport() {
                        toggleLoading(true);

                        try {
                            const json = await upload(false, ".json");
                            /** @type {typeof reports["value"]} */
                            const json_reports = _z.object({
                                date: _z.iso.date(),
                                actions: _z.string().noempty().array(),
                                memo: _z.string()
                            }).strict().array().parse(JSON.parse(await json.text()));

                            reports.value.splice(0);

                            for (const report of json_reports) {
                                reports.value.push(report);
                            }

                            pushToast("green", "リストア成功");
                        } catch (error) {
                            pushToast("red", "リストア失敗");

                            throw error;
                        } finally {
                            toggleLoading(false);
                        }
                    }

                    function exportReport() {
                        download(`${new Date().toLocaleString("sv-se").replace(/\D/g, "")}.json`, JSON.stringify(reports.value));
                    }

                    return {importReport, exportReport};
                }
            })
        }, {
            path: "/about",
            component: _defineComponent({
                template: /*html*/`
                    <v-container>
                        <v-card flat color="transparent">
                            <v-card-item>
                                <v-card-title class="text-headline-large">このアプリについて</v-card-title>
                            </v-card-item>
                        </v-card>
                    </v-container>
                `
            })
        }, {
            path: "/:catchAll(.*)",
            component: _defineComponent({
                template: /*html*/`
                    <v-container class="fill-height d-flex justify-center align-center">
                        <v-card flat color="transparent">
                            <v-card-item class="justify-center">
                                <v-card-title class="text-display-small">🥺Not Found🥺</v-card-title>
                            </v-card-item>

                            <v-card-actions class="justify-center">
                                <v-btn to="/" class="text-headline-small">Back to Top</v-btn>
                            </v-card-actions>
                        </v-card>
                    </v-container>
                `
            })
        }]
    });

    const vuetify = _createVuetify({
        theme: {
            defaultTheme: "system"
        },
        defaults: {
            VBtn: {
                class: ["text-none"]
            },
            VTextField: {
                variant: "underlined",
                color: "blue"
            },
            VTextarea: {
                variant: "underlined",
                color: "blue"
            },
            VDialog: {
                persistent: true,
                scrollable: true,
                maxHeight: 800,
                maxWidth: 600
            }
        }
    });

    _createApp(component).use(router).use(vuetify).mount("#root");
</script>

<style>
    @import "https://esm.sh/vuetify@4.1.7/dist/vuetify.css";
    @import "https://esm.sh/@mdi/font@7.4.47/css/materialdesignicons.css";
    @import "https://esm.sh/@fontsource/m-plus-1-code@5.3.0/index.css";

    * {
        font-family: "M PLUS 1 Code" !important;
        scrollbar-width: none !important;
    }
</style>

<title>元気ゲージ</title>

<div id="root"></div>
